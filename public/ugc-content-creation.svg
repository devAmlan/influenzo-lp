<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" fill="none" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0.6" y2="1"><stop stop-color="#c9b6f1"/><stop offset="0.55" stop-color="#a38ae4"/><stop offset="1" stop-color="#6b57c8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a3a8f" flood-opacity="0.25"/>
    </filter>
    <path id="star" d="M0-7l2 4.800 5.200.4-4 3.400 1.300 5.100L0 3.900-4.500 6.700-3.200 1.600l-4-3.400 5.200-.4Z"/>
  </defs>

  <!-- phone -->
  <rect x="170" y="40" width="220" height="440" rx="38" fill="#fff" fill-opacity="0.94" filter="url(#sh)"/>
  <rect x="182" y="52" width="196" height="416" rx="28" fill="url(#screen)"/>
  <rect x="254" y="60" width="52" height="10" rx="5" fill="#1c1a24" fill-opacity="0.85"/>

  <!-- story progress -->
  <rect x="198" y="84" width="164" height="4" rx="2" fill="#fff" fill-opacity="0.35"/>
  <rect x="198" y="84" width="92" height="4" rx="2" fill="#fff"/>

  <!-- creator on screen -->
  <g fill="#fff" fill-opacity="0.35">
    <circle cx="280" cy="206" r="34"/>
    <path d="M206 330a74 74 0 0 1 148 0Z"/>
  </g>
  <circle cx="280" cy="250" r="30" fill="#fff" fill-opacity="0.92"/>
  <path d="M273 238v24l20-12Z" fill="#7f6bd6"/>

  <!-- side actions -->
  <g fill="#fff" fill-opacity="0.28">
    <circle cx="358" cy="300" r="14"/>
    <circle cx="358" cy="340" r="14"/>
    <circle cx="358" cy="380" r="14"/>
  </g>
  <path d="M358 306c-6-4-9-7.500-9-11 0-3 2.300-5 4.700-5 1.800 0 3.400 1 4.300 2.600.9-1.600 2.500-2.600 4.300-2.600 2.400 0 4.700 2 4.700 5 0 3.500-3 7-9 11Z" fill="#fff"/>
  <rect x="351" y="333" width="14" height="11" rx="4" fill="#fff"/>
  <path d="M351 380l14-7v14Z" fill="#fff"/>

  <!-- caption -->
  <circle cx="206" cy="412" r="10" fill="#fff" fill-opacity="0.9"/>
  <text x="222" y="416" font-size="13" font-weight="600" fill="#fff">@mia.reviews</text>
  <rect x="198" y="430" width="140" height="6" rx="3" fill="#fff" fill-opacity="0.7"/>
  <rect x="198" y="444" width="96" height="6" rx="3" fill="#fff" fill-opacity="0.45"/>

  <!-- testimonial chip -->
  <rect x="30" y="140" width="176" height="74" rx="20" fill="#fff" filter="url(#sh)"/>
  <g fill="#f5b73b">
    <use href="#star" x="54" y="166"/>
    <use href="#star" x="72" y="166"/>
    <use href="#star" x="90" y="166"/>
    <use href="#star" x="108" y="166"/>
    <use href="#star" x="126" y="166"/>
  </g>
  <text x="48" y="196" font-size="13" font-weight="500" fill="#1c1a24">“Love this product!”</text>

  <!-- product demo chip -->
  <rect x="362" y="410" width="168" height="64" rx="20" fill="#fff" filter="url(#sh)"/>
  <rect x="376" y="424" width="36" height="36" rx="10" fill="#ece6fa"/>
  <path d="M385 438l9-5 9 5v10l-9 5-9-5Zm0 0l9 5 9-5m-9 5v10" stroke="#7f6bd6" stroke-width="1.600" stroke-linejoin="round"/>
  <text x="424" y="440" font-size="14" font-weight="600" fill="#1c1a24">Product demo</text>
  <text x="424" y="458" font-size="12" fill="#6f6a80">0:24 · 9:16</text>

  <!-- count chip -->
  <rect x="26" y="494" width="174" height="46" rx="23" fill="#1c1a24" filter="url(#sh)"/>
  <circle cx="52" cy="517" r="10" fill="#a38ae4"/>
  <path d="M52 512v10M47 517h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="522" font-size="14" font-weight="500" fill="#fff">24 UGC videos</text>
</svg>
