<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" fill="none" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9b6f1"/><stop offset="1" stop-color="#7f6bd6"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bba3ee"/><stop offset="1" stop-color="#988ae1"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad96e6"/><stop offset="1" stop-color="#6b57c8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a38ae4"/><stop offset="1" stop-color="#7f6bd6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a3a8f" flood-opacity="0.25"/>
    </filter>
    <g id="person"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g>
  </defs>

  <!-- roster card -->
  <rect x="80" y="70" width="400" height="400" rx="28" fill="#fff" fill-opacity="0.94" filter="url(#sh)"/>
  <text x="112" y="116" font-size="19" font-weight="600" fill="#1c1a24" letter-spacing="-0.4">Talent roster</text>
  <rect x="362" y="98" width="86" height="28" rx="14" fill="#ece6fa"/>
  <text x="405" y="116.5" font-size="12" font-weight="600" fill="#6b57c8" text-anchor="middle">12 creators</text>

  <!-- rows -->
  <g fill="#f4f0fc">
    <rect x="96" y="144" width="368" height="76" rx="20"/>
    <rect x="96" y="232" width="368" height="76" rx="20"/>
    <rect x="96" y="320" width="368" height="76" rx="20"/>
  </g>

  <circle cx="136" cy="182" r="24" fill="url(#a1)"/>
  <circle cx="136" cy="270" r="24" fill="url(#a2)"/>
  <circle cx="136" cy="358" r="24" fill="url(#a3)"/>
  <g fill="#fff" fill-opacity="0.95">
    <use href="#person" x="136" y="182"/>
    <use href="#person" x="136" y="270"/>
    <use href="#person" x="136" y="358"/>
  </g>

  <g font-size="16" font-weight="600" fill="#1c1a24" letter-spacing="-0.3">
    <text x="174" y="178">Aanya Sharma</text>
    <text x="174" y="266">Rohan Mehta</text>
    <text x="174" y="354">Isha Verma</text>
  </g>
  <g font-size="12" fill="#6f6a80">
    <text x="174" y="198">Lifestyle · 2.4M</text>
    <text x="174" y="286">Tech · 890K</text>
    <text x="174" y="374">Fashion · 1.1M</text>
  </g>

  <rect x="352" y="168" width="96" height="28" rx="14" fill="#7f6bd6"/>
  <text x="400" y="186.5" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Signed</text>
  <rect x="352" y="256" width="96" height="28" rx="14" fill="#e3daf8"/>
  <text x="400" y="274.5" font-size="12" font-weight="600" fill="#6b57c8" text-anchor="middle">Negotiating</text>
  <rect x="352" y="344" width="96" height="28" rx="14" fill="#e3daf8"/>
  <text x="400" y="362.5" font-size="12" font-weight="600" fill="#6b57c8" text-anchor="middle">Pitching</text>

  <!-- progress -->
  <text x="112" y="425" font-size="12" fill="#6f6a80">Deals closed this quarter</text>
  <text x="448" y="425" font-size="12" font-weight="600" fill="#1c1a24" text-anchor="end">8 / 12</text>
  <rect x="112" y="436" width="336" height="10" rx="5" fill="#ece6fa"/>
  <rect x="112" y="436" width="224" height="10" rx="5" fill="url(#bar)"/>

  <!-- floating chips -->
  <g filter="url(#sh)">
    <rect x="388" y="30" width="148" height="46" rx="23" fill="#fff"/>
    <rect x="26" y="494" width="190" height="46" rx="23" fill="#1c1a24"/>
  </g>
  <circle cx="413" cy="53" r="10" fill="#7f6bd6"/>
  <path d="M408.500 53l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="431" y="58" font-size="15" font-weight="600" fill="#1c1a24">$12K deal</text>
  <circle cx="52" cy="517" r="10" fill="#a38ae4"/>
  <path d="M47.500 517l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="522" font-size="14" font-weight="500" fill="#fff">Contract signed</text>
</svg>
