  <circle cx="564" cy="330" r="12" fill="url(#a3)"/><g transform="translate(564 330) scale(0.5)" fill="#fff" fill-opacity="0.95"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g>
  <text x="584" y="334" font-size="12" font-weight="600" fill="#1c1a24">Isha</text>
