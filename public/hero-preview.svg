    <circle cx="862" cy="130" r="24" fill="url(#a3)"/>
    <circle cx="850" cy="300" r="34" fill="url(#a2)"/>
  </g>
  <g transform="translate(104 150) scale(1.3)" fill="#fff" fill-opacity="0.95"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g><g transform="translate(146 310) scale(0.95)" fill="#fff" fill-opacity="0.95"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g><g transform="translate(862 130) scale(0.95)" fill="#fff" fill-opacity="0.95"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g><g transform="translate(850 300) scale(1.35)" fill="#fff" fill-opacity="0.95"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g>

