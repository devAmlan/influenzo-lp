    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bba3ee"/><stop offset="1" stop-color="#6b57c8"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad96e6"/><stop offset="1" stop-color="#988ae1"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a38ae4" stop-opacity="0.45"/><stop offset="1" stop-color="#a38ae4" stop-opacity="0"/></linearGradient>
