<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 580" fill="none" font-family="'Mona Sans Variable', 'Mona Sans', system-ui, sans-serif">
  <defs>
    <linearGradient id="a1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9b6f1"/><stop offset="1" stop-color="#7f6bd6"/></linearGradient>
    <linearGradient id="a2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bba3ee"/><stop offset="1" stop-color="#988ae1"/></linearGradient>
    <linearGradient id="a3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad96e6"/><stop offset="1" stop-color="#6b57c8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a38ae4"/><stop offset="1" stop-color="#7f6bd6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4a3a8f" flood-opacity="0.25"/>
    </filter>
    <g id="person"><circle cy="-5" r="8"/><path d="M-14 16A14 14 0 0 1 14 16Z"/></g>
  </defs>

  <!-- links from creators to the campaign card -->
  <g stroke="#fff" stroke-opacity="0.7" stroke-width="1.5" stroke-dasharray="4 5">
    <path d="M180 112V160Q180 170 190 170H270M280 112V170M380 112V160Q380 170 370 170H290"/>
  </g>

  <!-- creators -->
  <g filter="url(#sh)">
    <circle cx="180" cy="88" r="26" fill="url(#a1)" stroke="#fff" stroke-width="3"/>
    <circle cx="280" cy="88" r="26" fill="url(#a2)" stroke="#fff" stroke-width="3"/>
    <circle cx="380" cy="88" r="26" fill="url(#a3)" stroke="#fff" stroke-width="3"/>
  </g>
  <g fill="#fff" fill-opacity="0.95">
    <use href="#person" x="180" y="88"/>
    <use href="#person" x="280" y="88"/>
    <use href="#person" x="380" y="88"/>
  </g>

  <!-- campaign card -->
  <rect x="80" y="150" width="400" height="320" rx="28" fill="#fff" fill-opacity="0.94" filter="url(#sh)"/>

  <circle cx="140" cy="212" r="30" fill="url(#a1)"/>
  <use href="#person" x="140" y="212" fill="#fff" transform="translate(140 212) scale(1.15) translate(-140 -212)"/>
  <circle cx="162" cy="234" r="9" fill="#7f6bd6" stroke="#fff" stroke-width="3"/>
  <path d="M158 234l3 3 5-6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="186" y="208" font-size="19" font-weight="600" fill="#1c1a24" letter-spacing="-0.4">Aanya Sharma</text>
  <text x="186" y="230" font-size="13" fill="#6f6a80">@aanya.creates · Lifestyle</text>

  <rect x="372" y="196" width="84" height="32" rx="16" fill="#7f6bd6"/>
  <text x="414" y="217" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Matched</text>

  <path d="M112 262H448" stroke="#e7e0f7"/>

  <g font-size="26" font-weight="600" fill="#1c1a24" letter-spacing="-0.8">
    <text x="112" y="304">2.4M</text>
    <text x="236" y="304">6.8%</text>
    <text x="352" y="304">48</text>
  </g>
  <g font-size="12" fill="#6f6a80">
    <text x="112" y="324">Total reach</text>
    <text x="236" y="324">Engagement</text>
    <text x="352" y="324">Creators</text>
  </g>

  <!-- reach chart -->
  <g fill="#ece6fa">
    <rect x="112" y="352" width="26" height="90" rx="7"/>
    <rect x="151" y="352" width="26" height="90" rx="7"/>
    <rect x="190" y="352" width="26" height="90" rx="7"/>
    <rect x="229" y="352" width="26" height="90" rx="7"/>
    <rect x="268" y="352" width="26" height="90" rx="7"/>
    <rect x="307" y="352" width="26" height="90" rx="7"/>
    <rect x="346" y="352" width="26" height="90" rx="7"/>
    <rect x="385" y="352" width="26" height="90" rx="7"/>
    <rect x="424" y="352" width="26" height="90" rx="7"/>
  </g>
  <g fill="url(#bar)">
    <rect x="112" y="408" width="26" height="34" rx="7" opacity="0.45"/>
    <rect x="151" y="396" width="26" height="46" rx="7" opacity="0.5"/>
    <rect x="190" y="400" width="26" height="42" rx="7" opacity="0.55"/>
    <rect x="229" y="382" width="26" height="60" rx="7" opacity="0.65"/>
    <rect x="268" y="388" width="26" height="54" rx="7" opacity="0.75"/>
    <rect x="307" y="370" width="26" height="72" rx="7" opacity="0.85"/>
    <rect x="346" y="376" width="26" height="66" rx="7" opacity="0.9"/>
    <rect x="385" y="358" width="26" height="84" rx="7"/>
    <rect x="424" y="364" width="26" height="78" rx="7"/>
  </g>

  <!-- floating chips -->
  <g filter="url(#sh)">
    <rect x="398" y="468" width="122" height="46" rx="23" fill="#fff"/>
    <rect x="26" y="486" width="164" height="46" rx="23" fill="#1c1a24"/>
  </g>
  <path d="M427 482.5c-1.8-2.9-6.6-2.4-6.6 1.9 0 3.4 4.4 6.2 6.6 8 2.2-1.8 6.6-4.6 6.6-8 0-4.3-4.8-4.8-6.6-1.9Z" transform="translate(0 6)" fill="#e5547a"/>
  <text x="446" y="497" font-size="16" font-weight="600" fill="#1c1a24">128K</text>
  <circle cx="52" cy="509" r="10" fill="#a38ae4"/>
  <path d="M52 504v10M47 509h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="70" y="514" font-size="14" font-weight="500" fill="#fff">New campaign</text>
</svg>
